name: Feature request
description: Suggest an improvement to the system equalizer or menu bar experience.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the listening or editing workflow and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you would expect, including any UI changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional workarounds, sketches, or related ideas.
