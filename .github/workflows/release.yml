name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/master'
    runs-on: xcode-27
    environment: release-signing
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require recorded clean-Mac validation
        run: python3 scripts/check-release-readiness.py
      - name: Verify source
        run: |
          python3 scripts/check-repository.py
          swift test
          bash scripts/test-native.sh asan
          python3 scripts/analyze-native.py
      - name: Sign and notarize in an ephemeral keychain
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MYEQ_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MYEQ_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          MYEQ_INSTALLER_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/myeq-signing.XXXXXX")
          export MYEQ_KEYCHAIN="$signing_dir/release.keychain-db"
          export MYEQ_NOTARY_PROFILE=myeq-notary
          export MYEQ_SIGNING_MODE=production
          export SIGNING_P12_PATH="$signing_dir/certificates.p12"
          cleanup() { security delete-keychain "$MYEQ_KEYCHAIN" 2>/dev/null || true; rm -rf "$signing_dir"; }
          trap cleanup EXIT
          keychain_password=$(openssl rand -hex 32)
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['SIGNING_P12_PATH']).write_bytes(base64.b64decode(os.environ['SIGNING_P12_BASE64'], validate=True))
          PY
          security create-keychain -p "$keychain_password" "$MYEQ_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$MYEQ_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$MYEQ_KEYCHAIN"
          security import "$SIGNING_P12_PATH" -k "$MYEQ_KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$MYEQ_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$MYEQ_KEYCHAIN"
          xcrun notarytool store-credentials "$MYEQ_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$MYEQ_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$MYEQ_KEYCHAIN" >/dev/null
          # Build artifacts have public executable/read permissions; the keychain stays private.
          umask 022
          bash scripts/release.sh
          python3 scripts/test-installer-security.py
      - name: Upload verified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myEq-notarized
          path: |
            dist/myEq.pkg
            dist/myEq.pkg.sha256
          if-no-files-found: error
          retention-days: 14
